<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0e0b14"/>

  <!-- Left eye: sharp triangle, wide at top-left, point at inner-bottom -->
  <path d="M100 160 L230 175 L220 245 Z" fill="#e8650a"/>
  <!-- Left pupil -->
  <ellipse cx="180" cy="200" rx="7" ry="9" fill="#0e0b14"/>
  <circle cx="184" cy="197" r="2.5" fill="#fff"/>

  <!-- Right eye: mirror triangle, wide at top-right, point at inner-bottom -->
  <path d="M412 160 L282 175 L292 245 Z" fill="#e8650a"/>
  <!-- Right pupil -->
  <ellipse cx="340" cy="200" rx="6" ry="8" fill="#0e0b14"/>
  <circle cx="337" cy="197" r="2" fill="#fff"/>

  <!-- Wide grin — curls up sharply at ends, almost to eye level -->
  <path d="M75 240
           C80 280, 160 310, 256 312
           C352 310, 432 280, 437 240
           C430 310, 385 380, 256 385
           C127 380, 82 310, 75 240 Z"
        fill="#c4a8d8" stroke="#1a0a2e" stroke-width="2"/>

  <!-- Tooth divider lines -->
  <path d="M170 275 L164 370" stroke="#1a0a2e" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M213 283 L210 378" stroke="#1a0a2e" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M256 286 L256 382" stroke="#1a0a2e" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M299 283 L302 378" stroke="#1a0a2e" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M342 275 L348 370" stroke="#1a0a2e" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
