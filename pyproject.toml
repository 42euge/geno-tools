[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geno-tools"
version = "0.8.1"
description = "Unified geno control plane: resolve, scope, and launch skillset bundles"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "click>=8.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
geno-tools = "geno_tools.cli:main"

[tool.setuptools.packages.find]
include = ["geno_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
