site_name: geno-tools
site_description: Agent-agnostic meta package manager for AI coding agents
site_url: https://42euge.github.io/geno-tools
repo_url: https://github.com/42euge/geno-tools
repo_name: 42euge/geno-tools

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow
    - announce.dismiss

nav:
  - Home: index.md
  - Overview: docs-home.md
  - Getting Started: getting-started.md
  - CLI Reference: cli-reference.md
  - Skills Catalog:
