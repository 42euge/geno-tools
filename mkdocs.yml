site_name: geno-tools
site_description: Agent-agnostic meta package manager for AI coding agents
site_url: https://42euge.github.io/geno-tools
repo_url: https://github.com/42euge/geno-tools
repo_name: 42euge/geno-tools

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow
    - announce.dismiss

nav:
  - Home: index.md
  - Overview: docs-home.md
  - Getting Started: getting-started.md
  - CLI Reference: cli-reference.md
  - Skills Catalog:
      - skills/index.md
      - Core:
          - geno-tools: skills/geno-tools/index.md
          - geno-agents: skills/geno-agents/index.md
          - geno-notes: skills/geno-notes/index.md
          - geno-mon: skills/geno-mon/index.md
          - geno-msg: skills/geno-msg/index.md
      - Developer:
          - geno-dev: skills/geno-dev/index.md
          - geno-loops: skills/geno-loops/index.md
          - geno-specs: skills/geno-specs/index.md
      - Runtime:
          - geno-iso: skills/geno-iso/index.md
          - geno-term: skills/geno-term/index.md
          - geno-ws: skills/geno-ws/index.md
      - Tooling:
          - geno-mine: skills/geno-mine/index.md
      - Data & Research:
          - geno-kaggle: skills/geno-kaggle/index.md
          - geno-research: skills/geno-research/index.md
      - Creative:
          - geno-voice: skills/geno-voice/index.md
      - Life:
          - geno-career: skills/geno-career/index.md
          - geno-taxes: skills/geno-taxes/index.md
  - Skillsets:
      - skillsets/index.md
      - Creating a Skillset: skillsets/creating.md
      - Nomenclature: skillsets/nomenclature.md
  - Onboarding:
      - onboarding/index.md
      - Audit Process: onboarding/audit.md
  - Architecture:
      - architecture/index.md
      - Disk Layout: architecture/layout.md
      - Variants & Worktrees: architecture/variants.md
  - Ecosystem: ecosystem.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/face.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/42euge
  generator: false
