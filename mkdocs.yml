site_name: geno-tools
site_description: Meta-CLI for installing and managing AI coding agent skillsets
site_url: https://42euge.github.io/geno-tools
repo_url: https://github.com/42euge/geno-tools
repo_name: 42euge/geno-tools

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow
    - announce.dismiss

nav:
  - Home: index.md
  - Overview: docs-home.md
  - Getting Started: getting-started.md
  - CLI Reference: cli-reference.md
  - Skillsets:
      - skillsets/index.md
      - Creating a Skillset: skillsets/creating.md
      - Nomenclature: skillsets/nomenclature.md
  - Architecture:
      - architecture/index.md
      - Disk Layout: architecture/layout.md
      - Variants & Worktrees: architecture/variants.md
  - Ecosystem: ecosystem.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/face.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/42euge
  generator: false
