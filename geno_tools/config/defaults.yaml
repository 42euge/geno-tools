# ~/.geno/config.yaml — geno ecosystem user configuration
#
# Copy this file to ~/.geno/config.yaml and customize.

# Aliases control how slash commands are named when materialized
# into Claude Code (or other agents) during `geno-tools install`.
#
# command_prefix: the short prefix for slash commands.
#   "gt" (default) → /gt-install, /gt-<skillset>-<command>
#   "geno" → /geno-install, /geno-<skillset>-<command>
#   "" (empty) → /install, /<skillset>-<command>
aliases:
  command_prefix: "gt"

# Discovery: where to look for candidate skillset repos.
# Each source is a provider that can list repos in some org/group/project.
# A repo is considered installable when (a) its name matches `prefix*`
# and (b) it has a SKILL.md at root.
#
# `auth_env` names an environment variable holding the token — never paste
# tokens into this file directly.
discovery:
  sources:
    - kind: github
      org: 42euge          # discovers public geno-* repos
    # - kind: github
    #   org: acme-corp
    #   base_url: https://github.acme.com/api/v3
    #   prefix: acme-
    #   auth_env: ACME_GITHUB_TOKEN
    # - kind: gitlab
    #   group: platform/skillsets
    #   base_url: https://gitlab.acme.com
    #   prefix: acme-
    #   auth_env: ACME_GITLAB_TOKEN

# LLM: OpenAI-compatible endpoint for intelligent features (tab naming, etc.)
# Token goes in ~/.geno/settings.json — never put it here.
# Run `geno-tools llm probe` to discover models and benchmark them.
llm:
  endpoint: ""                        # e.g. http://litellm.local:4000
  model: ""                           # preferred model; blank = top probe result
  timeout: 10                         # per-request timeout (seconds)
  settings_file: "~/.geno/settings.json"
  model_rankings: []                  # populated by `geno-tools llm probe`

# Observability: skill trace and health system configuration.
observability:
  health_threshold: 0.7      # success rate below this flags needs_retro
  health_min_traces: 5       # minimum traces before health judgment

# Operational mode: "user" (default) or "dev".
# Dev mode enables auto-PRs for retro patches on ecosystem repos.
# Can be overridden per-session via GENO_MODE env var.
mode: user

# Autonomy level: 0, 1, or 2.
#   0 (passive) — traces via skill completion sections, no background work
#   1 (hook-initiated) — SessionStart/Stop hooks for health refresh and retro queue
#   2 (background daemon) — geno-iso housekeeping loop for wiki, mining, retro, discovery
# Can be overridden per-session via GENO_AUTONOMY env var.
autonomy: 1

# Mining: session mining and dataset generation configuration.
mining:
  enabled: true
  exclude_projects: []        # project slugs to skip (e.g., "taxes-*")
  exclude_skills: []          # skill names to skip
  scrub_paths: true           # replace absolute paths with relative
  scrub_secrets: true         # detect and redact API keys, tokens

# Workspace layout (used by geno-dev-workspaces-init)
workspaces:
  mode: color
  base_path: "~"
  color:
    default: code-red
    folders:
      - code-red
      - code-blue
      - code-purp
      - code-indigo
